<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanguo preview seed</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04060d;
        color: #cdd6e4;
        font-family: 'SF Mono', Menlo, Consolas, monospace;
      }
      .box { text-align: center; }
      h1 { font-size: 20px; letter-spacing: 0.2em; }
      p { color: #6f80a0; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>SEEDING SANGUO…</h1>
      <p id="status">正在把三国人物写入 localStorage，随后打开 Cavin。</p>
    </div>
    <script type="module">
      import { seedSanguoPreview } from './preview/seed.ts'
      const result = seedSanguoPreview()
      const status = document.getElementById('status')
      if (status) {
        status.textContent = `已写入 ${result.nodes.length} 位三国人物（${result.camps} 个势力，${result.roles} 种人物类别）。`
      }
      setTimeout(() => window.location.replace('/'), 900)
    </script>
  </body>
</html>
